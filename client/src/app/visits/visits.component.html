<div class="text-center mt-3">
    <h2>{{ getTitle() }}</h2>
  </div>
  
  <div class="container mt-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="btn-group">
        <button class="btn btn-primary"
                btnRadio="visited"
                [(ngModel)]="predicate"
                (click)="loadVisits()">Members I visit</button>
        <button class="btn btn-primary"
                btnRadio="visitedBy"
                [(ngModel)]="predicate"
                (click)="loadVisits()">Members who visit me</button>
      </div>
  
      <div class="btn-group">
        <button type="button"
                class="btn btn-primary"
                btnRadio="lastActive"
                [(ngModel)]="orderBy"
                (click)="loadVisits()">Visits in the past month</button>
        <button type="button"
                class="btn btn-primary"
                btnRadio="created"
                [(ngModel)]="orderBy"
                (click)="loadVisits()">All visits</button>
      </div>
    </div>
  
    <div class="row mt-3">
      @for (member of visitsService.paginatedResult()?.items; track member.id) {
        <div class="col-2">
          <app-member-card [member]="member"></app-member-card>
        </div>
      }
    </div>
  
    @if (visitsService.paginatedResult()?.pagination) {
      <div class="d-flex justify-content-center mt-3">
        <pagination
          [boundaryLinks]="true"
          [totalItems]="visitsService.paginatedResult()?.pagination!.totalItems"
          [itemsPerPage]="visitsService.paginatedResult()?.pagination!.itemsPerPage"
          (pageChanged)="pageChanged($event)"
          [(ngModel)]="visitsService.paginatedResult()?.pagination!.currentPage"
          [maxSize]="10"
          previousText="&lsaquo;"
          nextText="&rsaquo;"
          firstText="&laquo;"
          lastText="&raquo;">
        </pagination>
      </div>
    }
  </div>
