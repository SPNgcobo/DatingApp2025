<h2>VIP Panel</h2>
<div class="tab-panel">
    <tabset class="member-tabset">
        <tab heading ="User management" *appHasRole="['Admin', 'VIP']">
            <div class="container">
                <app-user-management></app-user-management>
            </div>
        </tab>
        <tab heading ="Photo management" *appHasRole="['Admin', 'VIP', 'Moderator']">
            <div class="container">
                <app-photo-management></app-photo-management>
            </div>
        </tab>
    </tabset>
</div>
